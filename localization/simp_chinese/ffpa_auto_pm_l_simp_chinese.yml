l_simp_chinese:
 je_ffpa_auto_pm_compat: "Tech & Res 自动生产适配"
 je_ffpa_auto_pm_compat_reason: "控制 Tech & Res 新增建筑及其扩展生产方式。类别按钮是普通生产管理的主开关，其下的建筑按钮可逐一选择建筑类型。普通生产会在相邻方式间双向试用；自动化、运输和数据优化只会向上升级，绝不主动降低。普通生产会在收益仍处于切换前记录的约 2% 档位内，且建筑保持盈利或接受补贴时保留候选，并使用价格迟滞与失败回滚；自动化和运输的向上候选在观察期结束后会无条件保留。频率与单次调整数量继续读取原管理日志的设置。"
 ffpa_auto_pm_add_compat_journal: "$je_ffpa_auto_pm_compat$"
 ffpa_auto_pm_add_compat_journal_desc: "立即将$je_ffpa_auto_pm_compat$重新加入日志；通常本模组会在每月国家脉冲时自动添加。"
 ffpa_auto_pm_resources_button: "矿产与资源开采"
 ffpa_auto_pm_resources_button_desc: "新增矿产与天然气建筑普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_agriculture_water_button: "农业与水资源"
 ffpa_auto_pm_agriculture_water_button_desc: "水培农场与水处理产业普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_chemicals_materials_button: "化工与新材料"
 ffpa_auto_pm_chemicals_materials_button_desc: "合金、电池、制药及合成材料产业普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_machinery_aerospace_button: "机械与航空航天"
 ffpa_auto_pm_machinery_aerospace_button_desc: "机器人与飞机制造产业普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_electronics_hardware_button: "电子与硬件"
 ffpa_auto_pm_electronics_hardware_button_desc: "处理器、电子、计算机及消费电子产业普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_digital_button: "数字产业"
 ffpa_auto_pm_digital_button_desc: "软件、数据中心、电信与互动媒体产业普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_business_logistics_button: "商务与物流服务"
 ffpa_auto_pm_business_logistics_button_desc: "办公楼与电子商务物流普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_energy_button: "能源产业"
 ffpa_auto_pm_energy_button_desc: "水电、地热与可再生能源发电普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。聚变电厂当前没有受管的普通生产升级链，仍受上游自动化设置控制。"
 ffpa_auto_pm_transport_urban_button: "交通与城市设施"
 ffpa_auto_pm_transport_urban_button_desc: "机场等新增交通与城市设施普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_culture_button: "文化产业"
 ffpa_auto_pm_culture_button_desc: "歌剧院、乐器工坊和出版产业普通生产管理的主开关；可用其下的建筑按钮逐一纳入或排除建筑类型。"
 ffpa_auto_pm_research_button: "研究设施"
 ffpa_auto_pm_research_button_desc: "研究中心非经济型生产方式管理的主开关；不执行强制收益验收，可用其下的建筑按钮纳入或排除研究中心。"
 ffpa_auto_pm_building_selector_desc: "将此建筑类型纳入或排除普通生产方式的自动管理；对应类别主开关也必须开启。此选择不会改变上游的自动化或运输设置。"
