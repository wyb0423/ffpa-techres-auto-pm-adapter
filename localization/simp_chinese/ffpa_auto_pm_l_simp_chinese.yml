l_simp_chinese:
 je_ffpa_auto_pm_compat: "Tech & Res 自动生产适配"
 je_ffpa_auto_pm_compat_reason: "控制 Tech & Res 新增建筑及其扩展生产方式。普通生产与自动化会在相邻方式间双向试用；当收益仍处于切换前记录的约 2% 档位内，且建筑保持盈利或接受补贴时保留候选，并使用价格迟滞、失败回滚、冷却和震荡锁避免反复切换。频率与单次调整数量继续读取原管理日志的设置。"
 ffpa_auto_pm_add_compat_journal: "$je_ffpa_auto_pm_compat$"
 ffpa_auto_pm_add_compat_journal_desc: "立即将$je_ffpa_auto_pm_compat$重新加入日志；通常本模组会在每月国家脉冲时自动添加。"
 ffpa_auto_pm_resources_button: "矿产与资源开采"
 ffpa_auto_pm_resources_button_desc: "自动管理新增矿产与天然气建筑的普通生产方式。"
 ffpa_auto_pm_agriculture_water_button: "农业与水资源"
 ffpa_auto_pm_agriculture_water_button_desc: "自动管理水培农场与水处理产业的普通生产方式。"
 ffpa_auto_pm_chemicals_materials_button: "化工与新材料"
 ffpa_auto_pm_chemicals_materials_button_desc: "自动管理合金、电池、制药及合成材料产业。"
 ffpa_auto_pm_machinery_aerospace_button: "机械与航空航天"
 ffpa_auto_pm_machinery_aerospace_button_desc: "自动管理机器人与飞机制造产业。"
 ffpa_auto_pm_electronics_hardware_button: "电子与硬件"
 ffpa_auto_pm_electronics_hardware_button_desc: "自动管理处理器、电子、计算机及消费电子产业。"
 ffpa_auto_pm_digital_button: "数字产业"
 ffpa_auto_pm_digital_button_desc: "自动管理软件、数据中心、电信与互动媒体产业。"
 ffpa_auto_pm_business_logistics_button: "商务与物流服务"
 ffpa_auto_pm_business_logistics_button_desc: "自动管理办公楼与电子商务物流。"
 ffpa_auto_pm_energy_button: "能源产业"
