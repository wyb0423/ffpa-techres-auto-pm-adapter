l_english:
 je_ffpa_auto_pm_compat: "Tech & Res Automatic Production Adapter"
 je_ffpa_auto_pm_compat_reason: "Controls Tech & Res buildings and their extended production methods. The category buttons are master switches for ordinary production, and the building buttons below them select individual building types. Ordinary production and automation test adjacent methods in both directions. Ordinary production retains a candidate when earnings remain within the captured roughly 2% band and the building stays profitable or subsidized, with price hysteresis and failure rollback. Automation and transportation never roll back a trial candidate; after their observation period they retain it unconditionally. Frequency and per-pass adjustment counts continue to follow the upstream manager settings."
 ffpa_auto_pm_add_compat_journal: "$je_ffpa_auto_pm_compat$"
 ffpa_auto_pm_add_compat_journal_desc: "Immediately restores $je_ffpa_auto_pm_compat$ to the Journal; the mod normally adds it during the monthly country pulse."
 ffpa_auto_pm_resources_button: "Mining and Resources"
 ffpa_auto_pm_resources_button_desc: "Master switch for ordinary production management in new mines and natural-gas extraction. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_agriculture_water_button: "Agriculture and Water"
 ffpa_auto_pm_agriculture_water_button_desc: "Master switch for ordinary production management in hydroponics and water industries. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_chemicals_materials_button: "Chemicals and Materials"
 ffpa_auto_pm_chemicals_materials_button_desc: "Master switch for ordinary production management in alloys, batteries, pharmaceuticals and synthetic materials. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_machinery_aerospace_button: "Machinery and Aerospace"
 ffpa_auto_pm_machinery_aerospace_button_desc: "Master switch for ordinary production management in robotics and aircraft industries. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_electronics_hardware_button: "Electronics and Hardware"
 ffpa_auto_pm_electronics_hardware_button_desc: "Master switch for ordinary production management in processors, electronics, computers and consumer electronics. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_digital_button: "Digital Industries"
 ffpa_auto_pm_digital_button_desc: "Master switch for ordinary production management in software, datacenters, telecommunications and interactive media. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_business_logistics_button: "Business and Logistics"
 ffpa_auto_pm_business_logistics_button_desc: "Master switch for ordinary production management in offices and e-commerce logistics. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_energy_button: "Energy Industries"
 ffpa_auto_pm_energy_button_desc: "Master switch for ordinary production management in hydroelectric, geothermal and renewable power. Use the building buttons below it to include or exclude individual types. Fusion power currently has no managed ordinary-production chain and remains under the upstream automation settings."
 ffpa_auto_pm_transport_urban_button: "Transport and Urban Facilities"
 ffpa_auto_pm_transport_urban_button_desc: "Master switch for ordinary production management in airports and other new urban facilities. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_culture_button: "Cultural Industries"
 ffpa_auto_pm_culture_button_desc: "Master switch for ordinary production management in opera, instrument workshops and publishing. Use the building buttons below it to include or exclude individual types."
 ffpa_auto_pm_research_button: "Research Facilities"
 ffpa_auto_pm_research_button_desc: "Master switch for non-economic research-center methods, which do not require a mandatory earnings test. Use the building button below it to include or exclude the research center."
 ffpa_auto_pm_building_selector_desc: "Include or exclude this building type from automatic ordinary-production management. Its category master switch must also be enabled. This selection does not change the upstream automation or transportation settings."
